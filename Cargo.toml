[package]
name = "kiku"
version = "0.1.0"
edition = "2021"
description = "Split Flame Japanese Immersion Audio Desk with Toggl Track auto-logging"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
vibrato = { version = "0.5", default-features = false }
ruzstd = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = 3
lto = true
strip = true
