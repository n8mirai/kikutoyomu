// Called ONLY when track changes, Reveal All toggles, or generating state changes — NEVER on tick or hover!
// Places all cues once so scrollHeight never jumps mid-playback (zero scroll jerking!).
function rebuildSubtitleFeed() {
  updateSubHeadUI();
  const feed = $('#sub-feed');
  feed.innerHTML = '';
  subRenderedCount = 0;
  subCamInited = false;

  if (!currentTrack) {
    feed.innerHTML = `<div class="sub-empty-box">Play an episode to follow subtitles</div>`;
    return;
  }
  if (subGenerating) {
    feed.innerHTML = `<div class="sub-empty-box"><span>Syncing Japanese audio with local Whisper…</span></div>`;
    return;
  }
  if (!subCues.length) {
    feed.innerHTML = `
      <div class="sub-empty-box">
        ${state.whisper_ready ? `<button class="btn-pill" id="btn-gen-subs">Generate Synced JP Subtitles</button>` : ''}
        <button class="btn-sub" id="btn-drop-srt">Upload .srt / .ass</button>
      </div>`;
    if ($('#btn-gen-subs')) $('#btn-gen-subs').onclick = generateSubtitlesForCurrent;
    $('#btn-drop-srt').onclick = () => openBulkModal(currentTrack.anime.id);
    return;
  }

  const revealThrough = Math.max(subCueIdx, subMaxSeen);
  const frag = document.createDocumentFragment();
  for (let i = 0; i < subCues.length; i++) {
    const submerged = !subRevealAll && i > revealThrough;
    frag.appendChild(createSubRowEl(subCues[i], i, submerged));
  }
  feed.appendChild(frag);
  subRenderedCount = subCues.length;
  applyCueStatesInPlace(false);
  requestAnimationFrame(() => {
    if (curTab === 'subs') {
      const target = computeContinuousSubTargetY();
      if (target !== null) {
        const sc = $('#sub-scroll');
        isCamScrolling = true;
        sc.scrollTop = target;
        subCamY = target;
        subCamInited = true;
        isCamScrolling = false;
      }
      updateSubDepthOptics();
      ensureSubCameraRunning();
    }
  });
}

function computeContinuousSubTargetY() {
  const sc = $('#sub-scroll');
  const feed = $('#sub-feed');
  if (!sc || !feed || !subCues.length) return null;
  const rows = feed.children;
  if (!rows.length || !rows[0].classList.contains('sub-row')) return null;

  const anchorIdx = subCueIdx >= 0 ? subCueIdx : Math.max(0, subMaxSeen);
  const curEl = rows[anchorIdx];
  if (!curEl) return null;

  const focal = sc.clientHeight * 0.50;
  const curMid = curEl.offsetTop + curEl.offsetHeight * 0.5;
  let desiredMid = curMid;

  // Continuously interpolate between current sentence and next sentence so scroll glides at calm constant velocity!
  if (anchorIdx + 1 < subCues.length && rows[anchorIdx + 1]) {
    const t = audio.currentTime + subOffset;
    const c0 = subCues[anchorIdx];
    const c1 = subCues[anchorIdx + 1];
    const span = Math.max(0.6, Math.min(8.0, c1.start - c0.start));
    if (t >= c0.start) {
      const frac = Math.max(0, Math.min(1, (t - c0.start) / span));
      const nextMid = rows[anchorIdx + 1].offsetTop + rows[anchorIdx + 1].offsetHeight * 0.5;
      desiredMid = curMid + (nextMid - curMid) * frac;
    }
  }
  return Math.max(0, desiredMid - focal);
}

// Top-down water-surface optics on BOTH the top and bottom edges of the reader viewport!
function updateSubDepthOptics() {
  const sc = $('#sub-scroll');
  const feed = $('#sub-feed');
  if (!sc || !feed || curTab !== 'subs') return;
  const viewH = sc.clientHeight || 1;
  const scrollTop = sc.scrollTop;
  const rows = feed.children;
  const edgeZone = 0.25;

  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (!r.classList.contains('sub-row')) continue;
    const top = r.offsetTop;
    const h = r.offsetHeight;
    // Skip rows far outside viewport for effortless 60fps performance
    if (top + h < scrollTop - 220 || top > scrollTop + viewH + 220) continue;

    const mid = top + h * 0.5;
    const ny = (mid - scrollTop) / viewH; // 0 = top edge, 0.5 = center, 1 = bottom edge
    let e = 1;
    if (ny < edgeZone) e = Math.max(0, ny / edgeZone);
    else if (ny > 1 - edgeZone) e = Math.max(0, (1 - ny) / edgeZone);

    // Smoothstep underwater optical curve (scale + blur + opacity on both top and bottom!)
    const s = e * e * (3 - 2 * e);
    const scale = (0.915 + 0.085 * s).toFixed(4);
    const blur = ((1 - s) * 7.5).toFixed(2) + 'px';
    const op = (0.08 + 0.92 * s).toFixed(3);
    r.style.setProperty('--depth-s', scale);
    r.style.setProperty('--depth-b', blur);
    r.style.setProperty('--depth-o', op);
  }
}

function isAutoScrollPausedByDict() {
  return popOpen || shiftHeld;
}

function tickSubCamera(now) {
  subCamRaf = 0;
  if (curTab !== 'subs' || !subCues.length || subGenerating || !subAutoScroll) {
    subCamLastMs = 0;
    return;
  }
  const dt = subCamLastMs ? Math.min(0.1, (now - subCamLastMs) / 1000) : 0.016;
  subCamLastMs = now;

  const sc = $('#sub-scroll');
  const inHarness = userAtBottom && !isAutoScrollPausedByDict();

  if (inHarness) {
    const target = computeContinuousSubTargetY();
    if (target !== null) {
      if (!subCamInited) { subCamY = sc.scrollTop; subCamInited = true; }
      const diff = target - subCamY;
      // Crisp magnetic snap when catching up (e.g. toggling Auto ON or falling back into harness),
      // silky calm glide when tracking live speech!
      const speed = Math.abs(diff) > 36 ? 9.0 : 3.2;
      const alpha = 1 - Math.exp(-speed * dt);
      subCamY = Math.abs(diff) < 0.35 ? target : subCamY + diff * alpha;
      isCamScrolling = true;
      sc.scrollTop = subCamY;
      isCamScrolling = false;
      updateSubDepthOptics();
    }
  } else {
    subCamY = sc.scrollTop;
  }

  // Keep camera alive whenever in reader with Auto ON so falling back into the harness catches instantly!
  if (curTab === 'subs' && subAutoScroll) {
    subCamRaf = requestAnimationFrame(tickSubCamera);
  } else {
    subCamLastMs = 0;
  }
}

function ensureSubCameraRunning() {
  if (!subCamRaf && curTab === 'subs' && subAutoScroll && subCues.length && !subGenerating) {
    subCamLastMs = performance.now();
    subCamRaf = requestAnimationFrame(tickSubCamera);
  }
}

function scrollSubsToBottom(smooth = true) {
  const sc = $('#sub-scroll');
  userAtBottom = true;
  $('#sub-jump-bottom').hidden = true;
  const target = computeContinuousSubTargetY();
  if (target !== null) {
    if (smooth && subAutoScroll) {
      // Let the unified 60fps harness spring glide cleanly to target (zero fight with native scrollTo!)
      subCamY = sc.scrollTop;
      subCamInited = true;
    } else if (smooth) {
      progScrollUntil = Date.now() + 650;
      sc.scrollTo({ top: target, behavior: 'smooth' });
      subCamY = target;
      subCamInited = true;
    } else {
      isCamScrolling = true;
      sc.scrollTop = target;
      subCamY = target;
      subCamInited = true;
      isCamScrolling = false;
    }
    updateSubDepthOptics();
  }
  ensureSubCameraRunning();
}

function applyCueStatesInPlace(shouldSnap) {
  const feed = $('#sub-feed');
  const rows = feed.children;
  const t = audio.currentTime + subOffset;
  const revealThrough = Math.max(subCueIdx, subMaxSeen);

  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (!r.classList.contains('sub-row')) continue;
    const idx = Number(r.dataset.subIdx);
    const isCur = idx === subCueIdx;
    const isPast = idx < subCueIdx || (subCueIdx < 0 && idx <= subMaxSeen);
    // Begin smoothly surfacing (浮かぶ) 0.55s before the line is spoken!
    const approaching = subCues[idx] && t >= subCues[idx].start - 0.55;
    const submerged = !subRevealAll && idx > revealThrough && !approaching;

    r.classList.toggle('submerged', submerged);
    r.classList.toggle('cur', isCur);
    r.classList.toggle('past', !isCur && isPast);
    r.classList.toggle('future', !isCur && !isPast);
  }

  if (curTab === 'subs') {
    if (shouldSnap && subAutoScroll && userAtBottom && !isAutoScrollPausedByDict()) {
      scrollSubsToBottom(true);
    }
    updateSubDepthOptics();
    ensureSubCameraRunning();
  }
}

// Runs smoothly every 200ms — ZERO innerHTML rebuilds, ONLY reveals approaching submerged rows & toggles classes!
function syncSubtitleToAudio(forceScroll = false) {
  if (!subCues.length || subGenerating) return;
  const t = audio.currentTime + subOffset;
  let found = -1;
  let latestPassed = -1;
  for (let i = 0; i < subCues.length; i++) {
    if (t >= subCues[i].start) latestPassed = i;
    if (t >= subCues[i].start && t <= subCues[i].end) { found = i; break; }
    if (subCues[i].start > t) break;
  }

  const cueChanged = found !== subCueIdx;
  if (latestPassed > subMaxSeen) subMaxSeen = latestPassed;
  if (cueChanged) subCueIdx = found;

  if (subRenderedCount !== subCues.length) {
    rebuildSubtitleFeed();
  }

  applyCueStatesInPlace(forceScroll);
  updateEphemeralSynopsis();
  if (cueChanged) {
    if (idleP > 0.04) renderIdleSubtitles();
    // Priority Purple chime (for flagged high-confidence unknown words!) or organic T1 (i+1) chime
    if (found >= 0 && !audio.paused && !pingedCues.has(found)) {
      const curRow = $('#sub-feed').querySelector(`.sub-row[data-sub-idx="${found}"]`);
      if (curRow && curRow.classList.contains('has-priority')) {
        pingedCues.add(found);
        playPriorityChime();
      } else if (curRow && curRow.classList.contains('t1')) {
        pingedCues.add(found);
        playT1Ping();
      }
    }
  }
}

function positionDictPop(anchorEl) {
  const pop = $('#dict-pop');
  if (!anchorEl) return;
  const r = anchorEl.getBoundingClientRect();
  const pw = Math.min(340, window.innerWidth - 24);
  let left = r.left + r.width / 2 - pw / 2;
  left = Math.max(12, Math.min(left, window.innerWidth - pw - 12));
  pop.style.left = left + 'px';

  // Prefer below word; flip above if close to bottom dock
  const spaceBelow = window.innerHeight - r.bottom - 88;
  if (spaceBelow >= 170) {
    pop.style.top = (r.bottom + 8) + 'px';
    pop.style.bottom = 'auto';
  } else {
    pop.style.top = 'auto';
    pop.style.bottom = (window.innerHeight - r.top + 8) + 'px';
  }
}

  } else {

      ).join('');
      const otherEntries = popData.slice(1, 4).map(e =>

      ).join('');
      moreHtml = `<div class="dict-more">${extraSenses}${otherEntries}</div>`;
    }
    bodyHtml = `
      <div class="dict-head">
        <span class="dict-word">${esc(top.word)}</span>
        ${top.reading && top.reading !== top.word ? `<span class="dict-read">${esc(top.reading)}</span>` : ''}
        ${jlpt}

      ${moreHtml}
      ${hasMore ? `<button class="dict-expand-btn" data-pop-more="1">${popExpanded ? 'Less ▴' : 'More ▾'}</button>` : ''}`;
  }

  pop.innerHTML = bodyHtml + `
    <div class="dict-tags">
      <button class="vtag known${curSt === 'known' ? ' on' : ''}" data-set-st="known" title="Key 1">Known</button>
      <button class="vtag learning${curSt === 'learning' ? ' on' : ''}" data-set-st="learning" title="Key 2">Learning</button>
      <button class="vtag unknown${curSt === 'unknown' ? ' on' : ''}" data-set-st="unknown" title="Key 3">Unknown</button>
      <button class="vtag ignore${curSt === 'ignore' ? ' on' : ''}" data-set-st="ignore" title="Key 4">Ignore</button>
    </div>`;
  pop.classList.add('open');
}

async function openDictPop(tokEl) {
  if (!tokEl) return;
  clearTimeout(popCloseTimer);
  const word = tokEl.dataset.word;          // Canonical MeCab lemma (for tagging & dict)
  const surf = tokEl.dataset.surf || word;  // Exact surface text in sentence
  const pos = tokEl.dataset.pos || '';      // MeCab POS (動詞, 名詞, 副詞, 形容詞)
  const ctx = tokEl.dataset.ctx || surf;
  if (!word) return;

  if (popAnchorEl && popAnchorEl !== tokEl) popAnchorEl.classList.remove('active-lookup');
  popAnchorEl = tokEl;
  popAnchorEl.classList.add('active-lookup');

  if (subAutoPause && !audio.paused && curTab === 'subs') { audio.pause(); pausedByDict = true; renderDock(); }
  if (subAutoPause && curTab === 'yt-play' && ytAdapter.isPlaying()) { ytAdapter.pause(); pausedByDict = true; }

  const cacheKey = `${word}|${surf}|${pos}`;
  const sameLookup = popOpen && popWord === word && popCtx === ctx;
  popOpen = true;
  popWord = word;
  popCtx = ctx;
  if (!sameLookup) { popExpanded = false; popData = dictClientCache.has(cacheKey) ? dictClientCache.get(cacheKey) : null; }

  positionDictPop(tokEl);
  renderDictPop();

  if (!dictClientCache.has(cacheKey)) {
    try {
      const res = await api(`/api/dict?q=${encodeURIComponent(surf)}&lemma=${encodeURIComponent(word)}&pos=${encodeURIComponent(pos)}&ctx=${encodeURIComponent(ctx)}`);
      const entries = res.entries || [];
      if (entries.length) dictClientCache.set(cacheKey, entries);
      if (popOpen && popWord === word && popCtx === ctx) {
        popData = entries;
        renderDictPop();
      }
    } catch (e) {
      if (popOpen && popWord === word && popCtx === ctx) { popData = []; renderDictPop(); }
    }
  }
}

function scheduleCloseDictPop() {
  clearTimeout(popCloseTimer);
  popCloseTimer = setTimeout(() => {
    const pop = $('#dict-pop');
    if (pop.matches(':hover')) return;
    if (shiftHeld && hoveredTokEl) return;
    closeDictPop(true);
  }, 180);
}

function closeDictPop(resumeIfPaused) {
  clearTimeout(popCloseTimer);
  if (popAnchorEl) { popAnchorEl.classList.remove('active-lookup'); popAnchorEl = null; }
  popOpen = false; popWord = ''; popExpanded = false;
  $('#dict-pop').classList.remove('open');

    pausedByDict = false;
    if (curTab === 'yt-play') ytAdapter.play();
    else { audio.play().catch(() => {}); renderDock(); }
  } else {
    pausedByDict = false;
  }
}

/* ================= Per-Episode Audio Progress Caching & Play Counts ================= */
let lastProgressSaveMs = 0;
let trackCompletedSent = false;
let pendingResumeSecs = 0;

function progressKey(aid, eid) { return `${aid}/${eid}`; }
function getProgress(aid, eid) { return (state.progress && state.progress[progressKey(aid, eid)]) || null; }

async function saveTrackProgress(forceCompleted = false, useBeacon = false) {
  if (!currentTrack) return;
  const aid = currentTrack.anime.id, eid = currentTrack.ep.id;
  const dur = (audio.duration && isFinite(audio.duration)) ? audio.duration : (currentTrack.ep.duration_secs || 0);
  const pos = audio.currentTime || 0;
  const nearEnd = dur > 15 && (pos >= dur - 10 || (pos / dur) >= 0.95);
  const shouldComplete = (forceCompleted || nearEnd) && !trackCompletedSent;
  if (shouldComplete) trackCompletedSent = true;
  if (!shouldComplete && !forceCompleted && pos < 1 && !nearEnd) return;

  const key = progressKey(aid, eid);
  const payload = {
    anime_id: aid,
    episode_id: eid,
    position_secs: (shouldComplete || nearEnd) ? 0 : pos,
    duration_secs: dur,
    completed: shouldComplete
  };

  // Update local cache immediately
  if (!state.progress) state.progress = {};
  const prev = state.progress[key] || { position_secs: 0, duration_secs: dur, completions: 0, last_played_at: '' };
  state.progress[key] = {
    position_secs: payload.position_secs,
    duration_secs: dur || prev.duration_secs,
    completions: prev.completions + (shouldComplete ? 1 : 0),
    last_played_at: new Date().toISOString()
  };

  if (useBeacon) {
    navigator.sendBeacon('/api/progress', new Blob([JSON.stringify(payload)], { type: 'application/json' }));
    return;
  }
  try {
    const res = await api('/api/progress', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.progress) state.progress[key] = res.progress;
  } catch (e) {}
}

  } else {
    pill.hidden = true;
  }

  const ovClock = $('#active-ov-clock');
  if (ovClock) ovClock.textContent = clockStr;
  let pct = 0;
  if (ytCurrentVideo && (!currentTrack || audio.paused)) {
    const dur = ytAdapter.getDuration() || ytCurrentVideo.duration_secs || 0;
    pct = dur > 0 ? Math.min(100, (ytAdapter.getTime() / dur) * 100) : 0;
  } else {
    pct = audio.duration > 0 ? Math.min(100, (audio.currentTime / audio.duration) * 100) : 0;
  }
  const ovProg = $('#active-ov-prog');
  if (ovProg) ovProg.style.width = pct + '%';
  $('#d-fill').style.width = pct + '%';

  // Periodically cache progress every 4s while playing (Audio OR background YT!)
  if (currentTrack && !audio.paused && Date.now() - lastProgressSaveMs >= 4000) {
    lastProgressSaveMs = Date.now();
    saveTrackProgress(false, false);
  }
  if (ytCurrentVideo && ytAdapter.isPlaying() && Date.now() - ytLastProgSaveMs >= 4000) {
    ytLastProgSaveMs = Date.now();
    saveYtProgress(false, false);
  }

  syncSubtitleToAudio();
  updateGoalBar();
}

function updateGoalBar() {
  const goalSecs = Math.max(60, (state.config.daily_goal_minutes || 60) * 60);
  const totalToday = (state.stats.today_secs || 0) + (sessionActive && !audio.paused ? currentSessionSecs() : 0);
  const pct = Math.min(100, Math.round((totalToday / goalSecs) * 100));
  $('#progress').style.width = pct + '%';
  $('#progress').classList.toggle('full', pct >= 100);
  const togglReady = !!(state.config.has_toggl_token && state.config.toggl_workspace_id && state.config.toggl_auto_sync);
  $('#vdot').className = 'dot-badge' + (togglReady ? ' on' : '');
}

async function startBackendSession(animeId, episodeId, playlistId) {
  try {
    const res = await api('/api/session/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ anime_id: animeId, episode_id: episodeId, playlist_id: playlistId || null })
    });
    state.active_session = res.active_session;
    state.history = res.history || state.history;
    state.stats = res.stats || state.stats;
    sessionStartedMs = Date.now();
    sessionActive = true;
    if (res.active_session?.toggl_error) toast('Toggl: ' + res.active_session.toggl_error, true);
  } catch (e) {}
  renderAll();
}

async function stopBackendSession(silent = false) {
  if (!sessionActive) return;
  const elapsed = currentSessionSecs();
  sessionActive = false; sessionStartedMs = 0;
  try {
    const res = await api('/api/session/stop', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ elapsed_secs: elapsed })
    });
    state.active_session = null;
    state.history = res.history || state.history;
    state.stats = res.stats || state.stats;
    if (!silent && res.logged) {
      toast(res.logged.toggl_synced ? `${fmtHuman(res.logged.duration_secs)} → Toggl` : `Logged ${fmtHuman(res.logged.duration_secs)}`);
    }
  } catch (e) {}
  renderAll();
}

async function playQueueIndex(idx) {
  if (idx < 0 || idx >= queue.length) return;
  if (ytCurrentVideo && ytAdapter.isPlaying()) { saveYtProgress(false, false); ytAdapter.pause(); }
  // Save current track progress before switching
  if (currentTrack) await saveTrackProgress(false, false);

  const item = queue[idx];
  const anime = getAnime(item.animeId), ep = getEpisode(item.animeId, item.episodeId);
  if (!anime || !ep || !ep.available || !ep.filename) {
    const next = queue.findIndex((q, i) => i > idx && getEpisode(q.animeId, q.episodeId)?.available);
    if (next >= 0) return playQueueIndex(next);
    openBulkModal(item.animeId);
    return;
  }
  queueIdx = idx;
  currentTrack = { anime, ep, playlistId: item.playlistId || null };
  trackCompletedSent = false;
  lastProgressSaveMs = Date.now();

  // Check cached progress to resume seamlessly (if >3s in and not near the end)
  const prog = getProgress(anime.id, ep.id);
  const estDur = (prog && prog.duration_secs > 0) ? prog.duration_secs : (ep.duration_secs || 0);
  pendingResumeSecs = (prog && prog.position_secs > 3 && (estDur <= 15 || prog.position_secs < estDur - 10))
    ? prog.position_secs
    : 0;

  audio.src = `/stream/${encodeURIComponent(anime.id)}/${encodeURIComponent(ep.filename)}`;
  audio.playbackRate = SPEEDS[speedIdx];
  loadSubtitlesForTrack(anime.id, ep.id);
  try {
    await audio.play();
    await startBackendSession(anime.id, ep.id, item.playlistId);
  } catch (e) { toast(e.message, true); }
  renderDock(); renderAll();
}

audio.addEventListener('loadedmetadata', () => {
  if (pendingResumeSecs > 0 && audio.duration > 15 && pendingResumeSecs < audio.duration - 10) {
    audio.currentTime = pendingResumeSecs;
    pendingResumeSecs = 0;
    syncSubtitleToAudio(true);
  } else {
    pendingResumeSecs = 0;
  }
});

function playAnime(animeId, startEpId = null) {
  const anime = getAnime(animeId); if (!anime) return;
  const playable = anime.episodes.filter(e => e.available);
  if (!playable.length) { selectedAnimeId = animeId; setTab('anime'); openBulkModal(animeId); return; }
  queue = playable.map(e => ({ animeId: anime.id, episodeId: e.id, playlistId: null }));

  let chosenEpId = startEpId;
  if (!chosenEpId) {
    // Auto-resume the most recently played in-progress episode of this anime!
    let best = null, bestTime = '';
    for (const e of playable) {
      const p = getProgress(anime.id, e.id);
      if (p && p.position_secs > 3 && p.last_played_at > bestTime) {
        best = e.id; bestTime = p.last_played_at;
      }
    }
    if (best) chosenEpId = best;
  }
  playQueueIndex(chosenEpId ? Math.max(0, queue.findIndex(q => q.episodeId === chosenEpId)) : 0);
}

function playPlaylist(plId, startIdx = 0) {
  const pl = state.playlists.find(p => p.id === plId); if (!pl) return;
  const items = pl.items.map(it => ({ animeId: it.anime_id, episodeId: it.episode_id, playlistId: pl.id }))
    .filter(it => getEpisode(it.animeId, it.episodeId)?.available);
  if (!items.length) return toast('No MP3s in playlist yet');
  queue = items;
  playQueueIndex(Math.min(startIdx, queue.length - 1));
}

async function togglePlayPause() {
  pausedByDict = false;
  if (!currentTrack) {
    const ready = state.library.find(a => a.episodes.some(e => e.available));
    return ready ? playAnime(ready.id) : openBulkModal('auto');
  }
  if (audio.paused) {
    await audio.play();
    if (!sessionActive) await startBackendSession(currentTrack.anime.id, currentTrack.ep.id, currentTrack.playlistId);
  } else {
    audio.pause();
    await saveTrackProgress(false, false);
    await stopBackendSession(false);
  }
  renderDock(); renderAll();
}

async function stopAndClear() {
  audio.pause();
  await saveTrackProgress(false, false);
  await stopBackendSession(false);
  renderDock(); renderAll();
}

audio.addEventListener('ended', async () => {
  await saveTrackProgress(true, false);
  await stopBackendSession(false);
  if (queueIdx + 1 < queue.length) playQueueIndex(queueIdx + 1);
  else { renderDock(); renderAll(); }
});
window.addEventListener('beforeunload', () => {
  if (currentTrack) saveTrackProgress(false, true);
  if (curTab === 'yt-play' && ytCurrentVideo) saveYtProgress(false, true);
  // Flush active session & batch-commit any pending local history to Toggl on app close!
  navigator.sendBeacon('/api/toggl/flush', new Blob([JSON.stringify({ elapsed_secs: sessionActive ? currentSessionSecs() : null })], { type: 'application/json' }));
});

async function savePlaylist(id, name, description, items) {

async function addEpisodeToPlaylist(plId, animeId, episodeId) {
  const pl = state.playlists.find(p => p.id === plId); if (!pl) return;
  await savePlaylist(pl.id, pl.name, pl.description, [...pl.items, { anime_id: animeId, episode_id: episodeId }]);

}

/* ================= RENDER: HISTORY (RICH THUMBNAILS + INTRA-ENTRY STATS + COLLAPSIBLE DAYS) ================= */
const collapsedHistoryDays = new Set();
const expandedHistoryStat = new Map(); // historyId -> 'lu' | 'lr' | 'kn'

function renderHistoryView() {
  const st = state.stats || { today_secs: 0, total_secs: 0, streak_days: 0 };
  const goalSecs = (state.config.daily_goal_minutes || 60) * 60;
  $('#h-stats').innerHTML = `
    <div class="stat-it"><div class="v${st.today_secs >= goalSecs ? ' ok' : ''}">${fmtHuman(st.today_secs)}</div><div class="l">Today</div></div>
    <div class="stat-it"><div class="v">${fmtHuman(st.total_secs)}</div><div class="l">Total</div></div>
    <div class="stat-it"><div class="v">${st.streak_days}d</div><div class="l">Streak</div></div>`;

  if (!state.history.length) { $('#h-list').innerHTML = ''; return; }

  const groups = new Map(), todayKey = new Date().toDateString(), yestKey = new Date(Date.now() - 864e5).toDateString();
  for (const h of state.history) {
    const d = new Date(h.started_at), key = d.toDateString();
    const label = key === todayKey ? 'Today' : (key === yestKey ? 'Yesterday' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }));
    if (!groups.has(key)) groups.set(key, { key, label, secs: 0, rows: [] });
    const g = groups.get(key); g.secs += h.duration_secs; g.rows.push(h);
  }

  $('#h-list').innerHTML = [...groups.values()].map(g => {
    const isCol = collapsedHistoryDays.has(g.key);
    return `
      <div class="day-lbl${isCol ? ' collapsed' : ''}" data-hday="${esc(g.key)}">
        <span><span class="day-chev">▾</span>${esc(g.label)} <span style="opacity:.55;font-weight:400">· ${g.rows.length}</span></span>
        <span>${fmtHuman(g.secs)}</span>
      </div>
      <div class="rows"${isCol ? ' hidden' : ''}>
        ${g.rows.map(h => {
          const isYt = h.anime_id === 'yt';
          const a = isYt ? null : getAnime(h.anime_id);
          const thumbHtml = isYt
            ? `<img class="h-thumb" src="https://i.ytimg.com/vi/${encodeURIComponent(h.episode_id)}/hqdefault.jpg" alt="" loading="lazy">`
            : (a?.has_cover ? `<img class="h-thumb sq" src="${coverUrl(a)}" alt="" loading="lazy">` : '');
          const luList = h.looked_up_words || [];
          const lrList = h.learning_words || [];
          const knList = h.known_words || [];
          const luCnt = Math.max(h.words_looked_up || 0, luList.length);
          const lrCnt = lrList.length;
          const knCnt = Math.max(h.words_marked_known || 0, knList.length);
          const hasStats = luCnt > 0 || lrCnt > 0 || knCnt > 0;
          const openCat = expandedHistoryStat.get(h.id) || '';
          const openWords = openCat === 'lu' ? luList : (openCat === 'lr' ? lrList : (openCat === 'kn' ? knList : []));
          return `
            <div class="h-entry">
              <div class="r h-row" style="cursor:default">
                ${thumbHtml}
                <div class="h-body">
                  <div class="h-title">${esc(h.episode_title)}</div>
                  <div class="h-meta">${esc(h.anime_title)}</div>
                </div>
                <span class="r-dur">${fmtClock(h.duration_secs)}</span>
                ${h.toggl_synced ? `<span class="sync-ok" title="Synced to Toggl">✓</span>` : `<button class="r-act-ic" data-sync="${esc(h.id)}" title="Sync to Toggl">↻</button>`}
                <span class="r-hover-acts"><button class="r-act-ic del" data-hdel="${esc(h.id)}" title="Remove">${IC_X}</button></span>
              </div>
              ${hasStats ? `
                <div class="h-stats-bar">
                  ${luCnt ? `<button class="h-stat-btn lu" data-hstat="${esc(h.id)}:lu">${luCnt} looked up ${openCat === 'lu' ? '▴' : '▾'}</button>` : ''}
                  ${lrCnt ? `<button class="h-stat-btn lr" data-hstat="${esc(h.id)}:lr">${lrCnt} learning ${openCat === 'lr' ? '▴' : '▾'}</button>` : ''}
                  ${knCnt ? `<button class="h-stat-btn kn" data-hstat="${esc(h.id)}:kn">+${knCnt} known ${openCat === 'kn' ? '▴' : '▾'}</button>` : ''}
                </div>` : ''}
              ${openCat && openWords.length ? `
                <div class="h-words-drawer">
                  ${openWords.map(w => `<span class="h-word-chip tok" data-word="${esc(w)}" data-surf="${esc(w)}" data-pos="" data-ctx="${esc(w)}" data-autoign="0">${esc(w)}</span>`).join('')}
                </div>` : ''}
            </div>`;
        }).join('')}
      </div>`;
  }).join('');

  $$('[data-hday]', $('#h-list')).forEach(el => el.onclick = () => {
    const k = el.dataset.hday;
    if (collapsedHistoryDays.has(k)) collapsedHistoryDays.delete(k);
    else collapsedHistoryDays.add(k);
    renderHistoryView();
  });
  $$('[data-hstat]', $('#h-list')).forEach(btn => btn.onclick = () => {
    const [hid, cat] = btn.dataset.hstat.split(':');
    if (expandedHistoryStat.get(hid) === cat) expandedHistoryStat.delete(hid);
    else expandedHistoryStat.set(hid, cat);
    renderHistoryView();
  });
  $$('[data-sync]', $('#h-list')).forEach(b => b.onclick = async () => {
    try { const res = await api(`/api/history/${encodeURIComponent(b.dataset.sync)}/sync-toggl`, { method: 'POST' }); state.history = res.history; toast('Synced'); renderHistoryView(); }
    catch (e) { toast(e.message, true); }
  });
  $$('[data-hdel]', $('#h-list')).forEach(b => b.onclick = async () => {
    const res = await api(`/api/history/${encodeURIComponent(b.dataset.hdel)}`, { method: 'DELETE' });
    state.history = res.history; state.stats = res.stats; renderHistoryView(); updateGoalBar();
  });
}

/* ================= SERIES FREQUENCY STATISTICS (MECAB LEMMAS + ZIPF LOG-Z + ECDF) ================= */
function buildSeriesFreqModel(lines, fileCount, backendWords) {
  const counts = new Map();
  const contexts = new Map();
  const posMap = new Map();
  let totalTokens = 0;

  if (Array.isArray(backendWords) && backendWords.length) {
    for (const bw of backendWords) {
      counts.set(bw.word, bw.count);
      contexts.set(bw.word, bw.ctx || bw.word);
      posMap.set(bw.word, bw.pos || '');
      totalTokens += bw.count;
    }
  } else {
    for (const line of (lines || [])) {
      const segs = segmentJapanese(line);
      let pos = 0;
      for (const s of segs) {
        const w = s.segment;
        const p = pos; pos += w.length;
        if (isAutoIgnoredToken(w, s.isWordLike)) continue;
        counts.set(w, (counts.get(w) || 0) + 1);
        totalTokens++;
        if (!contexts.has(w)) contexts.set(w, line.slice(p, p + 14).replace(/\s+/g, ''));
      }
    }
  }

  const arr = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const N = arr.length;
  if (!N) {
    return { byWord: new Map(), totalTypes: 0, totalTokens: 0, files: fileCount || 0, meanLog: 0, stdLog: 0, lines: lines || [], words: backendWords || [] };
  }

  // Log-transform counts: under Zipf/Pareto tail, ln(C) ~ Exponential(lambda), so z = (ln(C) - mu)/sigma is scale-invariant!
  let sumLog = 0;
  for (let i = 0; i < N; i++) sumLog += Math.log(arr[i][1]);
  const meanLog = sumLog / N;
  let sumSq = 0;
  for (let i = 0; i < N; i++) {
    const d = Math.log(arr[i][1]) - meanLog;
    sumSq += d * d;
  }
  const stdLog = Math.sqrt(sumSq / N);

  // Tie-aware competition rank & mid-rank ECDF percentile
  const byWord = new Map();
  let i = 0;
  while (i < N) {
    const c = arr[i][1];
    let j = i + 1;
    while (j < N && arr[j][1] === c) j++;
    const tieCount = j - i;
    const rank = i + 1; // 1-based competition rank
    const below = N - j;
    const pct = ((below + 0.5 * tieCount) / N) * 100; // Mid-rank Empirical CDF (0..100)
    const topPct = Math.max(0.1, 100 - pct);
    const z = stdLog > 1e-6 ? (Math.log(c) - meanLog) / stdLog : 0;

    let stars = 1;
    if (c >= 3 && (z >= 2.2 || pct >= 96.5)) stars = 5;
    else if (c >= 2 && (z >= 1.3 || pct >= 90.0)) stars = 4;
    else if (c >= 2 && (z >= 0.5 || pct >= 76.0)) stars = 3;
    else if (c >= 2) stars = 2;

    for (let k = i; k < j; k++) {
      const w = arr[k][0];
      byWord.set(w, {
        word: w,
        count: c,
        rank,
        totalTypes: N,
        totalTokens,
        pct,
        topPct,
        z,
        stars,
        files: fileCount || 0,
        pos: posMap.get(w) || '',
        ctx: contexts.get(w) || w
      });
    }
    i = j;
  }

  return { byWord, totalTypes: N, totalTokens, files: fileCount || 0, meanLog, stdLog, lines: lines || [], words: backendWords || [] };
}

async function ensureSeriesFreq(animeId, forceRefresh = false) {
  if (!animeId) return null;
  if (!forceRefresh && seriesFreqCache.has(animeId)) return seriesFreqCache.get(animeId);
  if (seriesFreqInflight.has(animeId)) return seriesFreqInflight.get(animeId);

  const p = (async () => {
    try {
      const res = await api(`/api/corpus/${encodeURIComponent(animeId)}`);
      const model = buildSeriesFreqModel(res.lines || [], res.files || 0, res.words || []);
      seriesFreqCache.set(animeId, model);
      if (popOpen && activeSeriesIdForDict() === animeId) renderDictPop();
      return model;
    } catch (e) {
      return null;
    } finally {
      seriesFreqInflight.delete(animeId);
    }
  })();
  seriesFreqInflight.set(animeId, p);
  return p;
}

function getSeriesFreqInfo(animeId, surfaceWord, headWord) {
  if (!animeId) return null;
  const model = seriesFreqCache.get(animeId);
  if (!model || !model.totalTypes) {
    ensureSeriesFreq(animeId);
    return null;
  }
  const a = surfaceWord ? model.byWord.get(surfaceWord) : null;
  // Only check headWord if it's a genuine lemma/compound (>= surface length), NEVER a shorter 1-kanji fallback like 中 for 中山!
  const validLemma = headWord && headWord !== surfaceWord && [...headWord].length >= [...(surfaceWord || '')].length;
  const b = validLemma ? model.byWord.get(headWord) : null;
  if (a && b) return a.count >= b.count ? a : b;
  return a || b || null;
}

function renderFreqStarsHtml(info) {
  if (!info) return '';
  const filled = '★'.repeat(info.stars);
  const empty = '★'.repeat(5 - info.stars);
  const topStr = info.topPct < 10 ? info.topPct.toFixed(1) : Math.round(info.topPct);
  const zStr = (info.z >= 0 ? '+' : '') + info.z.toFixed(2);
  const tip = `Series frequency: ${info.count}× (${info.files} file${info.files === 1 ? '' : 's'}) · Rank #${info.rank.toLocaleString()} / ${info.totalTypes.toLocaleString()} · Top ${topStr}% · log z = ${zStr}`;
  return `<span class="dict-freq" title="${esc(tip)}"><span class="dict-stars">${filled}<span class="off">${empty}</span></span><span class="dict-fcnt">${info.count}×</span></span>`;
}

/* ================= MEDIA WORD FREQUENCY MAP (PROPER WORDS: NOUNS & VERBS) ================= */
// Extra ultra-common syntax/pronoun/connector exclusions for the Word Map so only genuine nouns, verbs & adjectives appear
const WM_SKIP_COMMON = new Set([
  '何','誰','私','僕','俺','君','彼','彼女','自分','皆','みんな','人','事','物','時','所','方',
  '今','前','後','中','上','下','内','外','間','気','手','目','口','日','年','月','一','二','三',
  '四','五','六','七','八','九','十','百','千','万','言う','言っ','思い','思う','思っ','見る','見',
  '見た','見て','来る','行く','出る','入る','持つ','取る','知る','分かる','分る','聞く','話す','書く',
  'リブリボックス','パブリック','ドメイン','ボランティア','サイト','録音'
]);

function isProperContentWord(word, isWordLike) {
  if (isAutoIgnoredToken(word, isWordLike)) return false;
  if (WM_SKIP_COMMON.has(word)) return false;
  // Keep Kanji-containing words (nouns, verbs, adjectives) OR 3+ char Katakana loanwords!
  const hasKanji = /[\u4E00-\u9FFF々]/.test(word);
  if (hasKanji) {
    // Skip single-kanji grammatical suffixes/counters that aren't standalone proper words
    if (word.length === 1 && /[的性化者員家所場度回番第個本枚台匹頭杯冊分秒]/.test(word)) return false;
    return true;
  }
  // 3+ character Katakana loanwords (real nouns like ホテル, エネルギー, システム)
  if (/^[\u30A0-\u30FFー]{3,}$/.test(word)) return true;
  return false;
}

async function openWordMap(animeId, episodeId) {
  wmReturnTab = curTab !== 'wordmap' ? curTab : lastNonSubTab;
  wmAnimeId = animeId;
  wmEpisodeId = episodeId || null;
  wmScope = episodeId ? 'ep' : 'all';
  wmFilter = 'all';
  setTab('wordmap');
  await loadWordMapData();
}

async function loadWordMapData() {
  const anime = getAnime(wmAnimeId);
  const ep = wmEpisodeId ? getEpisode(wmAnimeId, wmEpisodeId) : null;
  $('#wm-title').textContent = (wmScope === 'ep' && ep) ? ep.title : (anime ? anime.title : '');
  $('#wm-scope-ep').hidden = !wmEpisodeId;
  $('#wm-scope-ep').classList.toggle('on', wmScope === 'ep');
  $('#wm-scope-all').classList.toggle('on', wmScope === 'all');
  $('#wm-grid').innerHTML = `<div class="sub-empty-box" style="width:100%">Mapping vocabulary…</div>`;
  $('#wm-cov').textContent = '';

  try {
    let lines = [];
    let backendWords = [];
    if (wmScope === 'all') {
      const model = await ensureSeriesFreq(wmAnimeId, true);
      lines = model ? model.lines : [];
      backendWords = model ? (model.words || []) : [];
    } else {
      ensureSeriesFreq(wmAnimeId); // Ensure series stats ready for 1-5★ dict hovers!
      const qs = wmEpisodeId ? `?episode_id=${encodeURIComponent(wmEpisodeId)}` : '';
      const res = await api(`/api/corpus/${encodeURIComponent(wmAnimeId)}${qs}`);
      lines = res.lines || [];
      backendWords = res.words || [];
    }

    if (backendWords.length) {
      wmEntries = backendWords
        .filter(w => w.content)
        .slice(0, 260)
        .map(w => ({ word: w.word, count: w.count, pos: w.pos || '', ctx: w.ctx || w.word }));
    } else {
      const counts = new Map();
      const contexts = new Map();
      for (const line of lines) {
        const segs = segmentJapanese(line);
        let pos = 0;
        for (const s of segs) {
          const w = s.segment;
          const p = pos; pos += w.length;
          if (!isProperContentWord(w, s.isWordLike)) continue;
          counts.set(w, (counts.get(w) || 0) + 1);
          if (!contexts.has(w)) contexts.set(w, line.slice(p, p + 14).replace(/\s+/g, ''));
        }
      }
      wmEntries = [...counts.entries()]
        .map(([word, count]) => ({ word, count, pos: '', ctx: contexts.get(word) || word }))
        .sort((a, b) => b.count - a.count || a.word.localeCompare(b.word))
        .slice(0, 260);
    }
    renderWordMapGrid();
  } catch (e) {
    $('#wm-grid').innerHTML = `<div class="sub-empty-box" style="width:100%">${esc(e.message)}</div>`;
  }
}

function updateWordMapCoverage() {
  let totalOcc = 0, knownOcc = 0;
  for (const e of wmEntries) {
    const st = getWordStatus(e.word, false);
    if (st === 'ignore') continue;
    totalOcc += e.count;
    if (st === 'known') knownOcc += e.count;
  }
  const pct = totalOcc > 0 ? Math.round((knownOcc / totalOcc) * 100) : 0;
  $('#wm-cov').textContent = `${pct}% known`;
}

function updateWordMapStatusInPlace(word) {
  updateWordMapCoverage();
  if (wmFilter !== 'all') { renderWordMapGrid(); return; }
  const st = getWordStatus(word, false);
  if (st === 'ignore') { renderWordMapGrid(); return; }
  $('#wm-grid').querySelectorAll('.tok').forEach(el => {
    if (el.dataset.word === word) {
      el.classList.remove('st-known', 'st-learning', 'st-unknown', 'st-ignore');
      el.classList.add('st-' + st);
    }
  });
}

function renderWordMapGrid() {
  const grid = $('#wm-grid');
  $$('[data-wm-f]').forEach(b => b.classList.toggle('on', b.dataset.wmF === wmFilter));

  if (!wmEntries.length) {
    grid.innerHTML = `<div class="sub-empty-box" style="width:100%">No synced subtitles yet for this media</div>`;
    $('#wm-cov').textContent = '';
    return;
  }

  updateWordMapCoverage();

  const filtered = wmEntries.filter(e => {
    const st = getWordStatus(e.word, false);
    if (st === 'ignore') return false;
    return wmFilter === 'all' || st === wmFilter;
  });

  if (!filtered.length) {
    grid.innerHTML = `<div class="sub-empty-box" style="width:100%">No words in this filter</div>`;
    return;
  }

  const maxC = filtered[0].count || 1;
  grid.innerHTML = filtered.map(e => {
    const st = getWordStatus(e.word, false);
    // Proportional font size scaling by frequency (13.5px -> 23px)
    const ratio = Math.log1p(e.count) / Math.log1p(maxC);
    const sz = (13.5 + ratio * 9.5).toFixed(1);
    return `
      <span class="wm-chip tok st-${st}" data-word="${esc(e.word)}" data-surf="${esc(e.word)}" data-pos="${esc(e.pos || '')}" data-ctx="${esc(e.ctx)}" data-autoign="0">
        <span class="wm-word" style="font-size:${sz}px">${esc(e.word)}</span>
        <span class="wm-cnt">${e.count}</span>
      </span>`;
  }).join('');
}

function setTab(t) {
  if (t !== 'subs' && t !== 'wordmap' && t !== 'yt-play') lastNonSubTab = t;
  // Save YT timestamp when navigating away, but DO NOT pause — keep YT playing in background!
  if (curTab === 'yt-play' && t !== 'yt-play') {
    saveYtProgress(false, false);
  }
  curTab = t;

// Clean VideoAdapter interface — YouTube IFrame now, mpv JSON-IPC plugs into this exact interface later!
const ytAdapter = {
  getTime() {
    try { return (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') ? (ytPlayer.getCurrentTime() || 0) : 0; }
    catch (e) { return 0; }
  },
  getDuration() {
    try { return (ytPlayer && typeof ytPlayer.getDuration === 'function') ? (ytPlayer.getDuration() || 0) : 0; }
    catch (e) { return 0; }
  },
  isPlaying() {
    try { return !!(ytPlayer && typeof ytPlayer.getPlayerState === 'function' && ytPlayer.getPlayerState() === 1); }
    catch (e) { return false; }
  },
  play() { try { if (ytPlayer?.playVideo) ytPlayer.playVideo(); } catch (e) {} },
  pause() { try { if (ytPlayer?.pauseVideo) ytPlayer.pauseVideo(); } catch (e) {} },
  toggle() { if (this.isPlaying()) this.pause(); else this.play(); },
  seek(sec) { try { if (ytPlayer?.seekTo) ytPlayer.seekTo(Math.max(0, sec), true); } catch (e) {} }
};

async function saveYtProgress(forceCompleted = false, useBeacon = false) {
  if (!ytCurrentVideo) return;
  const pos = ytAdapter.getTime();
  const dur = ytAdapter.getDuration() || ytCurrentVideo.duration_secs || 0;
  if (!forceCompleted && pos < 2) return;
  const nearEnd = dur > 20 && (pos >= dur - 12 || (pos / dur) >= 0.95);
  const payload = {
    anime_id: 'yt',
    episode_id: ytCurrentVideo.id,
    position_secs: (forceCompleted || nearEnd) ? 0 : pos,
    duration_secs: dur,
    completed: forceCompleted || nearEnd
  };
  if (!state.progress) state.progress = {};
  const key = progressKey('yt', ytCurrentVideo.id);
  const prev = state.progress[key] || { position_secs: 0, duration_secs: dur, completions: 0, last_played_at: '' };
  state.progress[key] = {
    position_secs: payload.position_secs,
    duration_secs: dur || prev.duration_secs,
    completions: prev.completions + (payload.completed ? 1 : 0),
    last_played_at: new Date().toISOString()
  };
  if (useBeacon) {
    navigator.sendBeacon('/api/progress', new Blob([JSON.stringify(payload)], { type: 'application/json' }));
    return;
  }
  try {
    const res = await api('/api/progress', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.progress) state.progress[key] = res.progress;
  } catch (e) {}
}

function updateYtTraceUI() {
  const lineEl = $('#yt-trace-line');

    if (lineEl) lineEl.textContent = ytCurrentVideo ? (ytCurrentVideo.title || '') : '';

    ytCardRenderKey = '';
    return;
  }
  const beats = synData.beats || [];
  let text = '';
  if (beats.length) {
    const t = ytAdapter.getTime() + ytOffset;
    let idx = 0;
    for (let i = 0; i < beats.length; i++) {
      if (t >= beats[i].start - 0.5) idx = i;
      else break;
    }
    text = beats[idx]?.text || '';
  }
  if (!text) text = synData.episode_summary || ytCurrentVideo.title || '';
  if (lineEl.textContent !== text) {
    lineEl.textContent = text;
    lineEl.classList.remove('scrolling');
    requestAnimationFrame(() => {
      const box = $('#yt-trace-marquee');
      if (!box) return;
      const overflow = lineEl.scrollWidth - box.clientWidth;
      if (overflow > 6) {
        lineEl.style.setProperty('--marquee-dist', `${-(overflow + 14)}px`);
        lineEl.style.setProperty('--marquee-dur', `${Math.max(9, (overflow + 14) / 24).toFixed(1)}s`);
        lineEl.classList.add('scrolling');
      }
    });
  }

  drawer.classList.toggle('open', ytTraceStage > 0);
  if (ytTraceStage > 0) {
    const generating = ytCurrentVideo && ytAiAutoInflight.has(ytCurrentVideo.id);
    const epSum = synData.episode_summary || (generating ? 'Generating video context…' : ytCurrentVideo.title);
    const chName = synData.series_title || ytCurrentVideo.channel || 'Channel';

function renderMd(raw) {
  const safe = esc(raw || '');
  const inline = s => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  const lines = safe.split('\n');
  let html = '', inUl = false, inOl = false;
  const closeLists = () => {
    if (inUl) { html += '</ul>'; inUl = false; }
    if (inOl) { html += '</ol>'; inOl = false; }
  };
  for (const line of lines) {
    const t = line.trim();
    if (!t) { closeLists(); continue; }
    const ulM = t.match(/^[\*\-•]\s+(.*)$/);
    const olM = t.match(/^\d+\.\s+(.*)$/);
    if (ulM) {
      if (inOl) { html += '</ol>'; inOl = false; }
      if (!inUl) { html += '<ul>'; inUl = true; }
      html += `<li>${inline(ulM[1])}</li>`;
    } else if (olM) {
      if (inUl) { html += '</ul>'; inUl = false; }
      if (!inOl) { html += '<ol>'; inOl = true; }
      html += `<li>${inline(olM[1])}</li>`;
    } else {
      closeLists();
      html += `<p>${inline(t)}</p>`;
    }
  }
  closeLists();
  return html;
}

function renderAiMessages() {
  const box = $('#ai-msgs');

    box.innerHTML = `<div class="ai-msg model"><p>Ask me about your Japanese immersion, grammar, or vocabulary.</p></div>`;
    return;

  box.innerHTML = aiChatHistory.map((m, idx) => {
    const isLast = idx === aiChatHistory.length - 1;
    const acts = (m.actions || []).map(a => `<span class="ai-act-tag">${esc(a.summary)}</span>`).join('');
    const body = m.role === 'model' ? renderMd(m.text) : `<p>${esc(m.text)}</p>`;
    const textBubble = (m.text || acts)
      ? `<div class="ai-msg ${m.role}${isLast ? ' fresh' : ''}">${body}${acts ? `<div>${acts}</div>` : ''}</div>`
      : '';
    const cals = (m.calibration || []);
    const calBubble = cals.length
      ? `<div class="ai-msg model ai-cal-bubble${isLast ? ' fresh' : ''}" data-cal-group="${idx}"><div class="ai-msg-cals" style="margin-top:0;padding-top:0;border-top:0">${cals.map((c, ci) => renderCalChipHtml(c, `--stagger:${ci * 55}ms`)).join('')}</div></div>`
      : '';
    return textBubble + calBubble;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function handleCalChipClick(e) {
  const yes = e.target.closest('[data-cal-yes]');
  const no = e.target.closest('[data-cal-no]');
  if (!yes && !no) return;
  const w = yes ? yes.dataset.calYes : no.dataset.calNo;
  const chip = e.target.closest('[data-cal-chip]');
  if (chip && chip.classList.contains('sinking')) return;
  if (chip) chip.classList.add('sinking');
  if (yes) {
    setWordStatus(w, 'known');
    toast(`${w} → Known`);
  } else {
    aiCalDismissed.add(w);
    setWordStatus(w, 'priority');
    toast(`${w} → Priority watch`);
  }
  aiCalCandidates = aiCalCandidates.filter(c => c.word !== w);
  const inBar = chip && $('#ai-cal-bar') && $('#ai-cal-bar').contains(chip);
  const bubble = chip ? chip.closest('[data-cal-group]') : null;
  if (bubble) {
    const gid = bubble.dataset.calGroup;
    if (!aiBubbleResults.has(gid)) aiBubbleResults.set(gid, { known: [], priority: [] });
    const rec = aiBubbleResults.get(gid);
    if (yes) rec.known.push(w);
    else rec.priority.push(w);
  }
  setTimeout(() => {
    if (chip) chip.classList.add('gone');
    if (inBar) {
      const remaining = $('#ai-cal-bar').querySelectorAll('[data-cal-chip]:not(.sinking)');
      if (remaining.length === 0) {
        if (aiCalCandidates.length > 0) renderAiCalibrationBar();
        else loadAiCalibration(true);
      }
    }
    if (bubble) {
      const rem = bubble.querySelectorAll('[data-cal-chip]:not(.sinking)');
      if (rem.length === 0) {
        const gid = bubble.dataset.calGroup;
        const rec = aiBubbleResults.get(gid) || { known: [], priority: [] };
        aiBubbleResults.delete(gid);
        const msgObj = aiChatHistory[Number(gid)];
        if (msgObj) msgObj.calibration = [];
        const summary = `I finished sorting those words! Marked known: [${rec.known.join('、') || 'none'}]. Flagged unknown/priority purple: [${rec.priority.join('、') || 'none'}]. Give a brief, encouraging reaction or tip.`;
        sendAiAutoFollowup(summary);
      }
    }
    if (curTab === 'vocab') {
      $('#vp-tab-pri').textContent = `Priority (${vocab.priority.size})`;
      $('#vp-tab-lrn').textContent = `Learning (${vocab.learning.size})`;
      $('#vp-tab-kn').textContent = `Known (${vocab.known.size})`;
    }
  }, 830);
}

function ensureYtIframeApi(onReady) {
  if (ytApiReady && window.YT && window.YT.Player) { onReady(); return; }
  const prev = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = () => {
    ytApiReady = true;
    if (prev) try { prev(); } catch (e) {}
    onReady();
  };
  if (!ytApiLoading) {
    ytApiLoading = true;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }
}

function mountYtPlayer(videoId, startSecs = 0) {
  ytPendingId = videoId;
  ytPendingStart = Math.floor(Math.max(0, startSecs || 0));
  ensureYtIframeApi(() => {
    if (ytPendingId !== videoId) return;
    if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
      ytPlayer.loadVideoById({ videoId, startSeconds: ytPendingStart });
      return;
    }
    $('#yt-iframe-slot').innerHTML = '<div id="yt-iframe-el"></div>';
    ytPlayer = new window.YT.Player('yt-iframe-el', {
      videoId,
      width: '100%',
      height: '100%',
      playerVars: { rel: 0, modestbranding: 1, playsinline: 1, autoplay: 1, start: ytPendingStart, cc_load_policy: 0, iv_load_policy: 3 },
      events: {
        onReady: e => {
          try { e.target.unloadModule('captions'); e.target.unloadModule('cc'); } catch (_) {}
          if (ytPendingId && ytPendingId !== videoId && ytPlayer?.loadVideoById) {
            ytPlayer.loadVideoById({ videoId: ytPendingId, startSeconds: ytPendingStart });
          }
        },
        onStateChange: e => {
          if (e.data === 1) {
            try { e.target.unloadModule('captions'); e.target.unloadModule('cc'); } catch (_) {}
            if (ytCurrentVideo && !ytSessionRunning) {
              ytSessionRunning = true;
              startBackendSession('yt', ytCurrentVideo.id, null);
            }
          } else if (e.data === 2 || e.data === 0) {
            saveYtProgress(e.data === 0, false);
            if (ytSessionRunning) {
              ytSessionRunning = false;
              stopBackendSession(true);
            }
          }
          renderDock();
        }
      }
    });
  });
}

async function ensureYtFeed(force = false, catOverride = null) {
  const cat = catOverride || ytCat;
  if (cat === 'saved' || cat.startsWith('custom:')) return;
  let slot = ytCatFeeds.get(cat);
  if (slot && slot.loading) return;
  if (slot && slot.items.length && !force) return;
  if (!slot || force) {
    slot = { items: [], wave: 0, loading: true, hasMore: true };
    ytCatFeeds.set(cat, slot);
  } else {
    slot.loading = true;
  }
  renderYtGrid();
  try {
    const res = await api(`/api/yt/feed?cat=${encodeURIComponent(cat)}&wave=0${force ? '&refresh=1' : ''}`);
    slot.items = res.items || [];
    slot.wave = 0;
    slot.hasMore = res.has_more !== false;
  } catch (e) {}
  finally {
    slot.loading = false;
    renderYtGrid();
  }
}

async function loadMoreYt() {
  // 1. Channel browse pagination
  if (ytChannelView) {
    if (ytChannelView.loading || !ytChannelView.continuation) return;
    ytChannelView.loading = true;
    renderYtSentinel();
    try {
      const res = await api(`/api/yt/channel/${encodeURIComponent(ytChannelView.id)}?continuation=${encodeURIComponent(ytChannelView.continuation)}`);
      const seen = new Set(ytChannelView.items.map(x => x.id));
      for (const it of (res.items || [])) {
        if (!seen.has(it.id)) { seen.add(it.id); ytChannelView.items.push(it); }
      }
      ytChannelView.continuation = res.continuation || null;
    } catch (e) { ytChannelView.continuation = null; }
    finally { ytChannelView.loading = false; renderYtGrid(); }
    return;
  }
  // 2. Active search pagination
  if (ytSearchResults !== null) {
    if (ytSearchLoadingMore || !ytSearchCont) return;
    ytSearchLoadingMore = true;
    renderYtSentinel();
    try {
      const res = await api('/api/yt/search', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: ytSearchQuery, localized_query: ytSearchLocalized, continuation: ytSearchCont })
      });
      const seen = new Set(ytSearchResults.map(x => x.id));
      for (const it of (res.items || [])) {
        if (!seen.has(it.id)) { seen.add(it.id); ytSearchResults.push(it); }
      }
      ytSearchCont = res.continuation || null;
    } catch (e) { ytSearchCont = null; }
    finally { ytSearchLoadingMore = false; renderYtGrid(); }
    return;
  }
  // 3. Custom saved tab pagination
  if (ytCat.startsWith('custom:')) {
    const tid = ytCat.slice(7);
    const tab = (state.config?.yt_tabs || []).find(t => t.id === tid);
    const meta = ytCustomTabCache.get(tid);
    if (!tab || !meta || meta.loading || !meta.continuation) return;
    meta.loading = true;
    renderYtSentinel();
    try {
      const res = await api('/api/yt/search', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: tab.query, localized_query: meta.localizedQuery, continuation: meta.continuation })
      });
      const seen = new Set(meta.items.map(x => x.id));
      for (const it of (res.items || [])) {
        if (!seen.has(it.id)) { seen.add(it.id); meta.items.push(it); }
      }
      meta.continuation = res.continuation || null;
    } catch (e) { meta.continuation = null; }
    finally { meta.loading = false; renderYtGrid(); }
    return;
  }
  // 4. Built-in hybrid category infinite waves
  if (ytCat === 'saved') return;
  const slot = ytCatFeeds.get(ytCat);
  if (!slot || slot.loading || !slot.hasMore || slot.wave >= 12) return;
  slot.loading = true;
  renderYtSentinel();
  try {
    const nextWave = slot.wave + 1;
    const res = await api(`/api/yt/feed?cat=${encodeURIComponent(ytCat)}&wave=${nextWave}`);
    const seen = new Set(slot.items.map(x => x.id));
    let added = 0;
    for (const it of (res.items || [])) {
      if (!seen.has(it.id)) { seen.add(it.id); slot.items.push(it); added++; }
    }
    slot.wave = nextWave;
    slot.hasMore = added > 0 && nextWave < 12;
  } catch (e) { slot.hasMore = false; }
  finally { slot.loading = false; renderYtGrid(); }
}

async function openYtChannel(channelId, channelName = '', channelPfp = '') {
  if (!channelId) return;
  ytSearchResults = null;
  ytChannelView = { id: channelId, name: channelName || 'Channel', pfp: channelPfp || '', items: [], continuation: null, loading: true };
  renderYtGrid();
  try {
    const res = await api(`/api/yt/channel/${encodeURIComponent(channelId)}`);
    if (ytChannelView && ytChannelView.id === channelId) {
      ytChannelView.name = res.channel_name || ytChannelView.name;
      ytChannelView.pfp = res.channel_pfp || ytChannelView.pfp;
      ytChannelView.items = res.items || [];
      ytChannelView.continuation = res.continuation || null;
    }
  } catch (e) { toast('Could not load channel', true); }
  finally {
    if (ytChannelView && ytChannelView.id === channelId) {
      ytChannelView.loading = false;
      renderYtGrid();
    }
  }
}

function ytProgBarHtml(vid) {
  const pr = getProgress('yt', vid);
  if (!pr || pr.position_secs < 3 || !pr.duration_secs) return '';
  const pct = Math.min(100, (pr.position_secs / pr.duration_secs) * 100);
  return `<div class="yt-prog-track"><div class="yt-prog-fill" style="width:${pct.toFixed(1)}%"></div></div>`;
}

async function loadYtCustomTab(tabId) {
  const tab = (state.config?.yt_tabs || []).find(t => t.id === tabId);
  if (!tab) return;
  if (ytCustomTabCache.has(tabId)) { renderYtGrid(); return; }
  ytCustomTabCache.set(tabId, { items: [], continuation: null, localizedQuery: '', loading: true });
  $('#yt-grid').innerHTML = `<div class="sub-empty-box" style="grid-column:1/-1">Loading ${esc(tab.label)}…</div>`;
  try {
    const res = await api('/api/yt/search', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: tab.query })
    });
    ytCustomTabCache.set(tabId, {
      items: res.items || [],
      continuation: res.continuation || null,
      localizedQuery: res.localized_query || tab.query,
      loading: false
    });
  } catch (e) {
    ytCustomTabCache.set(tabId, { items: [], continuation: null, localizedQuery: '', loading: false });
  }
  renderYtGrid();
}

function renderYtSentinel() {
  const el = $('#yt-sentinel');
  if (!el) return;
  let loading = false;
  let hasMore = false;
  if (ytChannelView) {
    loading = ytChannelView.loading;
    hasMore = !!ytChannelView.continuation;
  } else if (ytSearchResults !== null) {
    loading = ytSearchLoadingMore;
    hasMore = !!ytSearchCont;
  } else if (ytCat.startsWith('custom:')) {
    const meta = ytCustomTabCache.get(ytCat.slice(7));
    loading = !!(meta && meta.loading);
    hasMore = !!(meta && meta.continuation);
  } else if (ytCat !== 'saved') {
    const slot = ytCatFeeds.get(ytCat);
    loading = !!(slot && slot.loading);
    hasMore = !!(slot && slot.hasMore && slot.items.length > 0 && slot.wave < 12);
  }
  if (loading) {
    el.innerHTML = `<span style="font-size:12px;color:var(--faint)">Loading more Japanese videos…</span>`;
  } else if (hasMore) {
    el.innerHTML = `<button class="yt-more-btn" id="yt-load-more">Load more</button>`;
    $('#yt-load-more').onclick = () => loadMoreYt();
  } else {
    el.innerHTML = '';
  }
}

      $('#yt-grid').innerHTML = `<div class="sub-empty-box" style="grid-column:1/-1">Loading ${esc(ytChannelView.name)}…</div>`;

      $('#yt-grid').innerHTML = ytChannelView.items.length

        : `<div class="sub-empty-box" style="grid-column:1/-1">No videos found</div>`;
    }
    renderYtSentinel();
    return;
  }
  chHead.hidden = true;

  // Active search results view
  if (ytSearchResults !== null) {
    $('#yt-search-shell').classList.add('has-drop');
    $('#yt-search-trace').hidden = false;
    $('#yt-save-drop-lbl').textContent = 'Save tab?';
    $('#yt-grid').innerHTML = ytSearchResults.length
      ? ytSearchResults.map(v => ytCardHtml(v, 'data-yt-search-item', savedIds)).join('')
      : `<div class="sub-empty-box" style="grid-column:1/-1">No results found</div>`;
    renderYtSentinel();
    return;
  }
  $('#yt-search-shell').classList.remove('has-drop');
  $('#yt-search-trace').hidden = true;

  if (ytCat === 'saved') {
    const vids = state.youtube || [];
    $('#yt-grid').innerHTML = vids.map(v => `
      <div class="yt-card" data-yt-open="${esc(v.id)}">
        <img src="https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/hqdefault.jpg" alt="${esc(v.title)}" loading="lazy">
        ${v.has_subs ? `<span class="yt-sub-dot" title="JP subtitles ready"></span>` : ''}
        <button class="yt-card-del" data-yt-del="${esc(v.id)}" title="Remove">×</button>
        <div class="yt-card-veil"><div class="yt-card-title">${esc(v.title)}</div></div>
        ${ytProgBarHtml(v.id)}
      </div>`).join('');
    renderYtSentinel();
    return;
  }

  if (ytCat.startsWith('custom:')) {
    const tid = ytCat.slice(7);
    if (!ytCustomTabCache.has(tid)) { loadYtCustomTab(tid); return; }
    const meta = ytCustomTabCache.get(tid);
    const list = meta?.items || [];
    if (meta?.loading && !list.length) {
      $('#yt-grid').innerHTML = `<div class="sub-empty-box" style="grid-column:1/-1">Loading…</div>`;
    } else {
      $('#yt-grid').innerHTML = list.map(v => ytCardHtml(v, 'data-yt-custom-item', savedIds)).join('');
    }
    renderYtSentinel();
    return;
  }

  const slot = ytCatFeeds.get(ytCat);
  if (!slot) { ensureYtFeed(false, ytCat); return; }
  if (slot.loading && !slot.items.length) {
    $('#yt-grid').innerHTML = `<div class="sub-empty-box" style="grid-column:1/-1">Loading ImmersionTube…</div>`;
    renderYtSentinel();
    return;
  }

  $('#yt-grid').innerHTML = slot.items.map(v => ytCardHtml(v, 'data-yt-feed', savedIds)).join('');
  renderYtSentinel();
}

function updateYtWaterfallDepth() {
  const feed = $('#yt-feed');
  const rows = [...feed.querySelectorAll('.sub-row:not(.submerged)')];
  // In top-to-bottom waterfall (column-reverse), the last visible DOM child is visually at the TOP right under the video!
  if (!ytRevealAll) {
    const n = rows.length;
    rows.forEach((r, idx) => {
      const distFromTop = (n - 1) - idx; // 0 = newest right beneath video, 1 = just below, etc.
      const op = distFromTop === 0 ? 1 : Math.max(0.28, 0.88 - distFromTop * 0.14);
      const blur = distFromTop <= 1 ? 0 : Math.min(2.2, (distFromTop - 1) * 0.45);
      r.style.opacity = op.toFixed(3);
      r.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : '';
    });
  } else {
    rows.forEach(r => { r.style.opacity = ''; r.style.filter = ''; });
  }
}

function rebuildYtFeed() {
  updateYtHeadUI();
  const feed = $('#yt-feed');
  feed.classList.toggle('reveal-all', ytRevealAll);
  feed.innerHTML = '';
  if (!ytCues.length) {
    feed.innerHTML = `<div class="sub-empty-box">No Japanese subtitles found for this video</div>`;
    return;
  }
  const revealThrough = Math.max(ytCueIdx, ytMaxSeen);
  const frag = document.createDocumentFragment();
  for (let i = 0; i < ytCues.length; i++) {
    const submerged = !ytRevealAll && i > revealThrough;
    frag.appendChild(createSubRowEl(ytCues[i], i, submerged));
  }
  feed.appendChild(frag);
  applyYtCueStates(false);
}

function applyYtCueStates(forceScroll = false) {
  const feed = $('#yt-feed');
  const rows = feed.querySelectorAll('.sub-row');
  if (!rows.length) return;
  const revealThrough = Math.max(ytCueIdx, ytMaxSeen);
  const newlyRevealed = [];
  rows.forEach((r, i) => {
    const shouldSub = !ytRevealAll && i > revealThrough;
    const wasSub = r.classList.contains('submerged');
    if (wasSub !== shouldSub) {
      r.classList.toggle('submerged', shouldSub);
      if (wasSub && !shouldSub) newlyRevealed.push(r);
    }
    r.classList.toggle('cur', i === ytCueIdx);
    r.classList.toggle('past', i < ytCueIdx);
    if (wasSub && !shouldSub && i === ytCueIdx) {
      if (r.classList.contains('has-priority')) playPriorityChime();
      else if (r.classList.contains('t1')) playT1Ping();
    }
  });
  updateYtWaterfallDepth();

  // Dynamic FLIP liquid pour: measure exact height of newly revealed block(s) and glide the
  // entire waterfall down smoothly by that exact pixel distance so nothing "shoves" or teleports!
  if (!ytRevealAll && newlyRevealed.length > 0 && newlyRevealed.length <= 3 && ytUserAtTop) {
    let dh = 0;
    for (const r of newlyRevealed) {
      dh += r.offsetHeight + 10;
      r.classList.remove('yt-fresh');
      void r.offsetWidth;
      r.classList.add('yt-fresh');
    }
    if (dh > 0) {
      clearTimeout(ytFlipTimer);
      const durMs = Math.min(720, Math.max(400, Math.round(310 + dh * 2.1)));
      feed.style.transition = 'none';
      feed.style.transform = `translate3d(0,${-dh}px,0)`;
      void feed.offsetHeight;
      feed.style.transition = `transform ${durMs}ms cubic-bezier(.19,1,.22,1)`;
      feed.style.transform = 'translate3d(0,0,0)';
      ytFlipTimer = setTimeout(() => { feed.style.transition = ''; feed.style.transform = ''; }, durMs + 40);
    }
  }

  if (ytAutoScroll && (ytUserAtTop || forceScroll)) {
    const sc = $('#yt-scroll');
    if (!ytRevealAll) {
      if (sc.scrollTop > 2) sc.scrollTo({ top: 0, behavior: forceScroll ? 'smooth' : 'auto' });
    } else if (ytCueIdx >= 0 && rows[ytCueIdx]) {
      rows[ytCueIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

function syncYtSubtitles(force = false) {
  if (curTab !== 'yt-play') return;
  // Periodically cache YT watch timestamp every 4s for seamless resume!
  if (ytCurrentVideo && ytAdapter.isPlaying() && Date.now() - ytLastProgSaveMs >= 4000) {
    ytLastProgSaveMs = Date.now();
    saveYtProgress(false, false);
  }
  updateEphemeralSynopsis();
  if (!ytCues.length) return;
  const t = ytAdapter.getTime() + ytOffset;
  let active = -1;
  for (let i = 0; i < ytCues.length; i++) {
    if (t >= ytCues[i].start - 0.08 && t <= ytCues[i].end + 0.35) active = i;
    else if (t > ytCues[i].end + 0.35) active = i;
    else break;
  }
  if (active === ytCueIdx && !force) return;
  ytCueIdx = active;
  if (active > ytMaxSeen) ytMaxSeen = active;
  applyYtCueStates(force);
}

async function openYtVideo(video, prefetchedCues = null) {
  if (!audio.paused) { audio.pause(); renderDock(); }
  ytCurrentVideo = video;
  ytCues = prefetchedCues || [];
  ytCueIdx = -1;
  ytMaxSeen = -1;
  ytOffset = 0;
  ytSubsOn = true;
  ytUserAtTop = true;
  ytLastProgSaveMs = Date.now();
  synData = null; synBeatIdx = -1; setSynopsisStage(0);

  // Seamless timestamp pickup from cached progress!
  const prog = getProgress('yt', video.id);
  const startSecs = (prog && prog.position_secs > 3 && (!prog.duration_secs || prog.position_secs < prog.duration_secs - 12))
    ? prog.position_secs
    : 0;

  setTab('yt-play');
  updateYtHeadUI();
  mountYtPlayer(video.id, startSecs);

  if (!prefetchedCues) {
    $('#yt-feed').innerHTML = `<div class="sub-empty-box">Loading Japanese subtitles…</div>`;
    try {
      // Save to watched YT library & fetch subtitles cleanly in one call
      const alreadySaved = (state.youtube || []).some(v => v.id === video.id);
      if (!alreadySaved) {
        const res = await api('/api/yt/add', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: video.id })
        });
        if (res.videos) state.youtube = res.videos;
        if (res.video) {
          ytCurrentVideo = { ...res.video, channel_id: video.channel_id || '', channel_pfp: video.channel_pfp || '' };
        }
        ytCues = res.cues || [];
      } else {
        const res = await api(`/api/yt/${encodeURIComponent(video.id)}/subtitles`);
        ytCues = res.cues || [];
      }
    } catch (e) { ytCues = []; }
  }
  rebuildYtFeed();
  syncYtSubtitles(true);
  loadSynopsisForYt(video.id);
  loadRelatedForYt(video.id);
  clearInterval(ytPollTimer);
  ytPollTimer = setInterval(() => syncYtSubtitles(false), 140);
}

const subScrollEl = $('#sub-scroll');

  if (!subAutoScroll) return;
  if (e.deltaY < 0) {
    // User scrolled upward -> release harness
    userAtBottom = false;
    $('#sub-jump-bottom').hidden = !(curTab === 'subs');
  } else if (e.deltaY > 0 && !userAtBottom) {
    // User scrolled downward -> check if falling back into the live subtitle harness
    const target = computeContinuousSubTargetY();
    if (target !== null && subScrollEl.scrollTop + e.deltaY >= target - 120) {
      userAtBottom = true;
      subCamY = subScrollEl.scrollTop;
      subCamInited = true;
      $('#sub-jump-bottom').hidden = true;
      ensureSubCameraRunning();

  subCamY = subScrollEl.scrollTop;

    if (subScrollEl.scrollTop < target - 110) {

document.addEventListener('keydown', e => {
  if (e.key === 'Shift') {
    shiftHeld = true;
    if (hoveredTokEl) openDictPop(hoveredTokEl);
    return;
  }
  const typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT');
  if (e.altKey && e.key === '1') { e.preventDefault(); setTab('anime'); return; }
  if (e.altKey && e.key === '2') { e.preventDefault(); setTab('yt'); return; }
  if (e.altKey && e.key === '3') { e.preventDefault(); setTab('books'); return; }
  if (e.altKey && e.key === '4') { e.preventDefault(); setTab('ai'); return; }
  if (e.altKey && e.key === '5') { e.preventDefault(); setTab('vocab'); return; }
  if (e.key === 'Escape') {
    if (popOpen) { closeDictPop(true); return; }
    if (synStage > 0) { setSynopsisStage(0); return; }
    if (curTab === 'yt-play') { clearInterval(ytPollTimer); setTab('yt'); return; }
    if (curTab === 'wordmap') { setTab(wmReturnTab); return; }
    if (curTab === 'subs') { setTab(lastNonSubTab); return; }
    $('#pop').hidden = true; $('#add-modal').hidden = true; $('#bulk-modal').hidden = true; return;
  }
  if (typing) return;
  // Instant 1/2/3/4 tagging for active lookup or hovered word
  const activeWord = popOpen ? popWord : (hoveredTokEl ? hoveredTokEl.dataset.word : '');
  if ((curTab === 'subs' || curTab === 'wordmap' || curTab === 'yt-play' || curTab === 'ai') && activeWord && !e.altKey && !e.ctrlKey) {
    if (e.key === '1' || e.key === '!') { e.preventDefault(); setWordStatus(activeWord, 'known'); return; }
    if (e.key === '2' || e.key === '@') { e.preventDefault(); setWordStatus(activeWord, 'learning'); return; }
    if (e.key === '3' || e.key === '#') { e.preventDefault(); setWordStatus(activeWord, 'unknown'); return; }
    if (e.key === '4' || e.key === '$') { e.preventDefault(); setWordStatus(activeWord, 'ignore'); return; }
  }
  if (curTab === 'yt-play') {
    if (e.code === 'Space') { e.preventDefault(); ytAdapter.toggle(); return; }
    if (e.key === 's' || e.key === 'S') { toggleYtSubs(); return; }
    if (e.key === 'j' || e.key === 'J') { ytAdapter.seek(ytAdapter.getTime() - 10); return; }
    if (e.key === 'l' || e.key === 'L') { ytAdapter.seek(ytAdapter.getTime() + 10); return; }
  }
  if (e.code === 'Space') { e.preventDefault(); togglePlayPause(); }
  else if (e.key === 's' || e.key === 'S') { toggleSubsTab(); }
  else if (e.key === 'j' || e.key === 'J') audio.currentTime = Math.max(0, audio.currentTime - 10);
  else if (e.key === 'l' || e.key === 'L') audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);
  else if (e.key === 'n' || e.key === 'N') playQueueIndex(queueIdx + 1);
  else if (e.key === 'p' || e.key === 'P') playQueueIndex(queueIdx - 1);
});

    shiftHeld = false;

});

/* ================= AMBIENT IDLE SUBTITLE VEIL ================= */
const IDLE_START_MS = 7000;   // Begin gradual blur after 7s of inactivity
const IDLE_RAMP_MS  = 15000;  // Smoothly reach full ambient subtitles by 22s
let lastActivityMs = Date.now();
let lastPtrX = -1, lastPtrY = -1;
let idleP = 0;                // Current visual blend [0..1]
let idleRenderedIdx = -2;
let idleRafId = 0;
let idleLastFrameMs = 0;

function isIdleEligible() {
  if (!currentTrack || audio.paused || !subCues.length || subGenerating) return false;
  if (curTab === 'subs' || curTab === 'yt-play') return false;
  if (popOpen || shiftHeld) return false;
  if (!$('#pop').hidden || !$('#bulk-modal').hidden || !$('#add-modal').hidden) return false;
  return true;
}

function renderIdleSubtitles(force = false) {
  const showIdx = subCueIdx >= 0 ? subCueIdx : subMaxSeen;
  if (!force && showIdx === idleRenderedIdx) return;
  idleRenderedIdx = showIdx;
  const stage = $('#idle-stage');
  if (showIdx < 0 || !subCues[showIdx]) { stage.innerHTML = ''; return; }

  // Show ONLY the current subtitle rising gently to the surface (浮かぶ)
  const cue = subCues[showIdx];
  stage.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'idle-row cur';
  const { html, unknownCount: n } = renderCueTokensHtml(cue, true);
  if (n === 1) row.classList.add('t1');
  else if (n === 2) row.classList.add('t2');
  else if (n === 3) row.classList.add('t3');
  row.innerHTML = `<div class="idle-line">${html}</div>`;
  stage.appendChild(row);
}

function applyIdleVisual() {
  const veil = $('#idle-veil');
  if (idleP <= 0.002) {
    idleP = 0;
    veil.classList.remove('active');
    veil.style.setProperty('--idle-p', '0');
    veil.style.setProperty('--idle-sub-op', '0');
    return;
  }
  veil.classList.add('active');
  // Smoothstep for backdrop blur; reveal current subtitle ahead of blur so there is ZERO readability downtime!
  const smooth = idleP * idleP * (3 - 2 * idleP);
  const subOp = Math.min(1, Math.pow(smooth, 0.55) * 1.45);
  veil.style.setProperty('--idle-p', smooth.toFixed(4));
  veil.style.setProperty('--idle-sub-op', subOp.toFixed(4));
  if (subOp > 0.01) renderIdleSubtitles(false);
}

function tickIdleVeil(now) {
  idleRafId = 0;
  const dt = idleLastFrameMs ? Math.min(120, now - idleLastFrameMs) : 16;
  idleLastFrameMs = now;

  let target = 0;
  if (isIdleEligible()) {
    const idleMs = Date.now() - lastActivityMs;
    if (idleMs > IDLE_START_MS) {
      target = Math.min(1, (idleMs - IDLE_START_MS) / IDLE_RAMP_MS);
    }
  }

  if (target > idleP) {
    // Gradual organic drift in
    idleP = Math.min(target, idleP + dt / IDLE_RAMP_MS);
  } else if (target < idleP) {
    // Crisp ~240ms snap-back wake when user moves/clicks/scrolls!
    idleP = Math.max(target, idleP - dt / 240);
  }

  applyIdleVisual();

  if (idleP > 0 || target > 0) {
    idleRafId = requestAnimationFrame(tickIdleVeil);
  } else {
    idleLastFrameMs = 0;
  }
}

function noteUserActivity() {
  const wasAmbient = idleP > 0.08;
  lastActivityMs = Date.now();
  // When snapping out of ambience on the Reader, land directly on the live current subtitle!
  if (wasAmbient && curTab === 'subs' && subCues.length) {
    scrollSubsToBottom(false);
  }
  if (idleP > 0 && !idleRafId) {
    idleLastFrameMs = performance.now();
    idleRafId = requestAnimationFrame(tickIdleVeil);
  }
}

// Only break ambience when actively interacting INSIDE Kiku!
// Passing the cursor over an unfocused Kiku window while working in other apps will NOT break ambience.
window.addEventListener('pointermove', e => {
  if (!document.hasFocus()) return;
  if (lastPtrX >= 0 && Math.hypot(e.clientX - lastPtrX, e.clientY - lastPtrY) < 6) return;
  lastPtrX = e.clientX; lastPtrY = e.clientY;
  noteUserActivity();
}, { passive: true });
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => {
  window.addEventListener(ev, noteUserActivity, { passive: true, capture: true });
});
// Keep advancing smoothly even while Kiku is unfocused on a side monitor
setInterval(() => {
  if (!idleRafId) {
    const eligible = isIdleEligible();
    const idleMs = Date.now() - lastActivityMs;
    if (eligible && idleMs >= IDLE_START_MS) {
      const target = Math.min(1, (idleMs - IDLE_START_MS) / IDLE_RAMP_MS);
      if (idleP < target) {
        idleP = Math.min(target, idleP + 250 / IDLE_RAMP_MS);
        applyIdleVisual();
      }
      idleLastFrameMs = performance.now();
      idleRafId = requestAnimationFrame(tickIdleVeil);
    } else if (idleP > 0 && !eligible) {
      idleLastFrameMs = performance.now();
      idleRafId = requestAnimationFrame(tickIdleVeil);
    }
  }
}, 250);

// Restore saved theme, subtitle font size & auto-scroll preference
try { applyTheme(localStorage.getItem('kiku.theme') || 'split-flame'); } catch (e) { applyTheme('split-flame'); }
try { const savedSz = localStorage.getItem('kiku.subSize'); if (savedSz) applySubFontSize(savedSz); } catch (e) {}
try {
  const savedAuto = localStorage.getItem('kiku.autoScroll');
  if (savedAuto !== null) subAutoScroll = savedAuto !== '0';
  $('#sub-autoscroll').classList.toggle('on', subAutoScroll);
} catch (e) {}

setInterval(updateLiveTimers, 200);
loadState().catch(e => toast(e.message, true));
</script>
</body>
</html>
